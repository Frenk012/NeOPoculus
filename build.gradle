plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'maven-publish'
	id 'java-library'
	id 'eclipse'
	id 'net.neoforged.moddev' version '2.0.78'
	id 'idea'
}


java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

version = project.mod_version
group = project.maven_group

sourceSets {
//	desktop {
//	}


}

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()

			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			// Its own directory: sharing run/ with the client would put both on the
			// same world save, the same config and the same horizon-lod cache, which
			// is exactly the confusion a server test is meant to rule out.
			gameDirectory = file('run-server')
		}

		// Client that joins the local test server straight away, so the
		// server-provided LOD path can be exercised without clicking through
		// the multiplayer menu on every run.
		clientJoin {
			client()
			programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		// Unattended shaderpack sweep: quick-plays into the test world, then
		// applies every pack in turn and screenshots each one. Beats doing it by
		// hand, and leaves a comparable record — same scene, same camera, one
		// file per pack in run/screenshots/.
		runShaderTest {
			client()
			programArguments.addAll '--quickPlaySingleplayer', 'asd'
			systemProperty 'horizon.shadertest', 'true'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'

			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
//			sourceSet sourceSets.desktop
		}
	}
}

repositories {
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://maven.blamejared.com/"
	}
	maven {
		url "https://maven.neoforged.net/releases"
	}
	maven {
		name = "TauMC"
		url = "https://maven.taumc.org/releases"
	}
	flatDir(
			dirs: 'libs'
	)
	mavenCentral()
}

dependencies {

	additionalRuntimeClasspath "io.github.douira:glsl-transformer:2.0.2"
	additionalRuntimeClasspath "org.anarres:jcpp:1.4.14"
	implementation "maven.modrinth:embeddium:${embeddium_version}"
	compileOnly("maven.modrinth:distanthorizonsapi:3.0.0")
	compileOnly("maven.modrinth:mekanism:10.7.8.70")

	implementation jarJar("io.github.douira:glsl-transformer:2.0.2")
	implementation jarJar("org.anarres:jcpp:1.4.14")

	implementation jarJar("curse.maven:swaying-garden-1203057:6266721")
	implementation jarJar("com.github.argon4w:acceleratedrendering:${acceleratedrendering_version}")


	jarJar(implementation("org.taumc:glsl-transformation-lib:0.2.0-20.ge3cb096")) {
		transitive = false
	}
	additionalRuntimeClasspath("org.taumc:glsl-transformation-lib:0.2.0-20.ge3cb096") {
		transitive = false
	}

}


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			neo_version            : neo_version,
			neo_version_range      : neo_version_range,
			loader_version_range   : loader_version_range,
			mod_version            : mod_version
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

